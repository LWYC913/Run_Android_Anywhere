[package]
name = "run-anywhere-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-nats = "=0.42.0"
async-trait = "=0.1.88"
axum = "=0.8.8"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "=0.3.31"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
run-anywhere-contracts.workspace = true
run-anywhere-repository.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "=2.0.18"
tokio = { version = "=1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
url = "=2.5.7"
uuid = { version = "=1.16.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
