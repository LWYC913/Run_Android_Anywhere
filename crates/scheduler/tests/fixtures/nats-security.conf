# Test-only NATS 2.10 server for exercising the Part 4 authorization boundary.
# These credentials are intentionally local, static, and unsuitable for deployment.
port: 4223
http_port: 8223

jetstream {
  store_dir: "/data/jetstream-security-test"
  max_memory_store: 64MB
  max_file_store: 1GB
}

authorization {
  users: [
    {
      user: "api"
      password: "api-test-password"
      permissions: {
        publish: {
          allow: ["jobs.queued"]
        }
        subscribe: {
          allow: ["_INBOX.api.>"]
        }
      }
    }
    {
      user: "scheduler"
      password: "scheduler-test-password"
      permissions: {
        publish: {
          allow: [
            "jobs.queued",
            "jobs.dead",
            "workers.*.dispatch",
            "_INBOX.workers.*.>",
            "$JS.ACK.JOB_QUEUE.job-dispatch-v1.>",
            "$JS.ACK.JOB_ADVISORIES.job-advisory-recovery-v1.>",
            "$JS.API.STREAM.INFO.JOB_QUEUE",
            "$JS.API.STREAM.CREATE.JOB_QUEUE",
            "$JS.API.STREAM.UPDATE.JOB_QUEUE",
            "$JS.API.STREAM.MSG.GET.JOB_QUEUE",
            "$JS.API.STREAM.MSG.DELETE.JOB_QUEUE",
            "$JS.API.STREAM.INFO.JOB_DLQ",
            "$JS.API.STREAM.CREATE.JOB_DLQ",
            "$JS.API.STREAM.UPDATE.JOB_DLQ",
            "$JS.API.STREAM.INFO.JOB_ADVISORIES",
            "$JS.API.STREAM.CREATE.JOB_ADVISORIES",
            "$JS.API.STREAM.UPDATE.JOB_ADVISORIES",
            "$JS.API.CONSUMER.INFO.JOB_QUEUE.job-dispatch-v1",
            "$JS.API.CONSUMER.CREATE.JOB_QUEUE.job-dispatch-v1.jobs.queued",
            "$JS.API.CONSUMER.MSG.NEXT.JOB_QUEUE.job-dispatch-v1",
            "$JS.API.CONSUMER.INFO.JOB_ADVISORIES.job-advisory-recovery-v1",
            "$JS.API.CONSUMER.CREATE.JOB_ADVISORIES.job-advisory-recovery-v1",
            "$JS.API.CONSUMER.MSG.NEXT.JOB_ADVISORIES.job-advisory-recovery-v1"
          ]
        }
        subscribe: {
          allow: [
            "control.workers.*.register",
            "control.workers.*.heartbeat",
            "control.jobs.*.transition",
            "control.jobs.*.result",
            "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.JOB_QUEUE.job-dispatch-v1",
            "$JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.JOB_QUEUE.job-dispatch-v1",
            "_INBOX.scheduler.>"
          ]
        }
      }
    }
    {
      user: "worker-alpha"
      password: "worker-alpha-test-password"
      permissions: {
        publish: {
          allow: [
            "control.workers.wrk_alpha.register",
            "control.workers.wrk_alpha.heartbeat",
            "control.jobs.wrk_alpha.transition",
            "control.jobs.wrk_alpha.result"
          ]
        }
        subscribe: {
          allow: [
            "workers.wrk_alpha.dispatch",
            "_INBOX.workers.wrk_alpha.>"
          ]
        }
        allow_responses: true
      }
    }
    {
      user: "worker-beta"
      password: "worker-beta-test-password"
      permissions: {
        publish: {
          allow: [
            "control.workers.wrk_beta.register",
            "control.workers.wrk_beta.heartbeat",
            "control.jobs.wrk_beta.transition",
            "control.jobs.wrk_beta.result"
          ]
        }
        subscribe: {
          allow: [
            "workers.wrk_beta.dispatch",
            "_INBOX.workers.wrk_beta.>"
          ]
        }
        allow_responses: true
      }
    }
  ]
}
